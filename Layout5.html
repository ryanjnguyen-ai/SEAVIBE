<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>SeaVibe - Phòng Live Tương Tác</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Asap+Condensed:wght@500;700&family=Quicksand:wght@500;600;700&display=swap');

        body, a, button, .playlist-item, .icon-btn, .seek-bar, .volume-slider, span, div { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' style='font-size:26px;'><text x='18' y='26' text-anchor='middle' transform='rotate(-25 18 18)'>🔱</text></svg>") 8 4, auto !important; }
        input { cursor: text !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* FIX TRÀN VIỀN NGANG & NỀN GỐC */
        html, body {
            height: 100dvh;
            width: 100%; /* Sửa từ 100vw thành 100% để tránh tràn viền */
            overflow: hidden; font-family: 'Quicksand', sans-serif;
            background-color: #05161d;
            background-image: url('Layout-Hinhnen.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            position: relative;
        }
        .vintage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.2); z-index: 1; pointer-events: none; }

        /* HEADER - FIX DYNAMIC ISLAND CHO IPHONE 15 PRO MAX */
        header {
            position: relative; z-index: 50; width: 100%;
            /* Dùng hàm max() để ép cách đỉnh ít nhất 55px, tránh đụng Dynamic Island */
            padding: max(env(safe-area-inset-top), 55px) max(env(safe-area-inset-right), 20px) 15px max(env(safe-area-inset-left), 20px);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .icon-btn { width: 45px; height: 45px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; transition: 0.3s; color: #fff; font-size: 20px; }
        .live-title { color: #fff; font-size: 22px; font-weight: 700; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 10px; }
        .live-dot { width: 10px; height: 10px; background-color: #ff4757; border-radius: 50%; box-shadow: 0 0 8px #ff4757; animation: blink 1.5s infinite; flex-shrink: 0; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .btn-toggle-chat {
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(135, 206, 235, 0.6); padding: 8px 15px; border-radius: 30px; height: 45px;
            color: #fff; font-size: 14px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 5px; box-shadow: 0 0 15px rgba(135, 206, 235, 0.3); cursor: pointer; white-space: nowrap;
        }

        /* BỐ CỤC CHÍNH ĐƯỢC ÉP LẠI TRÁNH TRÀN VIỀN DƯỚI/CẠNH */
        .main-container {
            position: relative; z-index: 10; display: flex; width: 100%;
            height: calc(100dvh - 110px);
            padding: 0 max(env(safe-area-inset-right), 20px) max(env(safe-area-inset-bottom), 20px) max(env(safe-area-inset-left), 20px);
            gap: 20px;
        }
        
        .video-wrapper-section { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        
        .player-container {
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(135, 206, 235, 0.5); border-radius: 15px; overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; flex-shrink: 0;
        }
        #video-wrapper { width: 100%; position: relative; padding-top: 56.25%; background: #000; }
        #html5-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .seek-bar-container { width: 100%; background: rgba(0,0,0,0.3); display: flex; align-items: center; }
        .seek-bar { width: 100%; -webkit-appearance: none; background: transparent; height: 10px; margin: 0; }
        .seek-bar::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(255,255,255,0.2); }
        .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #87CEEB; border-radius: 50%; margin-top: -5px; }
        .custom-controls { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .control-group { display: flex; align-items: center; gap: 10px; }
        .control-btn { background: none; border: none; color: #fff; font-size: 18px; }
        .volume-slider { width: 70px; accent-color: #87CEEB; }
        .time-display { color: #eee; font-size: 13px; font-weight: 600; }

        .tabs-container {
            display: flex; flex-direction: column; flex: 1; min-height: 0;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .tabs-header { display: flex; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn {
            flex: 1; padding: 12px; border: none; background: transparent; color: rgba(255,255,255,0.6);
            font-size: 15px; font-weight: 700; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .tab-btn.active { color: #87CEEB; background: rgba(135, 206, 235, 0.1); border-bottom: 2px solid #87CEEB; }
        
        .tabs-content { flex: 1; position: relative; overflow: hidden; display: flex; }
        .tab-pane { width: 100%; height: 100%; flex-shrink: 0; display: none; flex-direction: column; overflow-y: auto; }
        .tab-pane.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .pomo-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .pomo-header-btns { display: flex; gap: 8px; background: rgba(255,255,255,0.1); padding: 5px; border-radius: 20px; margin-bottom: 20px; }
        .pomo-btn { background: none; border: none; color: #ccc; font-weight: 600; font-size: 13px; padding: 8px 12px; border-radius: 15px; }
        .pomo-btn.active { background: rgba(135, 206, 235, 0.5); color: #fff; }
        .pomo-time { font-size: 55px; font-weight: 700; color: #fff; letter-spacing: 2px; font-family: 'Asap Condensed', sans-serif; margin-bottom: 20px; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .pomo-start { background: #87CEEB; color: #000; font-weight: 700; font-size: 16px; padding: 12px 40px; border-radius: 30px; border: none; box-shadow: 0 5px 15px rgba(135, 206, 235, 0.4); }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; gap: 10px; }
        .avatar { width: 32px; height: 32px; background: #87CEEB; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; font-size: 13px; flex-shrink: 0; }
        .msg-content { background: rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 0 15px 15px 15px; color: #eee; font-size: 13px; line-height: 1.4; }
        .msg-author { font-size: 11px; color: #87CEEB; font-weight: 700; margin-bottom: 2px; }
        .message.self { flex-direction: row-reverse; }
        .message.self .msg-content { border-radius: 15px 0 15px 15px; background: rgba(135, 206, 235, 0.2); color: #fff; }
        .message.self .msg-author { text-align: right; }
        .message.self .avatar { background: #f4a460; color: #fff; }

        /* FIX KHÔNG GÕ ĐƯỢC CHỮ TRÊN IOS */
        .chat-input-wrapper { padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); }
        .btn-emoji { background: none; border: none; font-size: 22px; }
        .chat-input-wrapper input {
            flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3); color: #fff; outline: none; font-size: 14px;
            /* 3 dòng dưới đây bắt buộc phải có để bàn phím ảo iPhone bật lên */
            -webkit-user-select: auto !important;
            user-select: auto !important;
            pointer-events: auto !important;
            touch-action: manipulation;
        }
        .btn-send { background: #87CEEB; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; }

        .sidebar-section { flex: 0 0 300px; display: flex; flex-direction: column; gap: 15px; transition: all 0.4s ease; overflow-y: auto; scrollbar-width: none; padding-bottom: 20px;}
        .sidebar-section::-webkit-scrollbar { display: none; }
        .sidebar-section.hidden { flex: 0 0 0%; min-width: 0; opacity: 0; margin-left: -20px; pointer-events: none; }
        
        .widget-block { background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 15px; box-shadow: -5px 0 20px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; }
        
        .playlist-section { padding: 15px; }
        .playlist-section h3 { color: #fff; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;}
        .playlist-items { display: flex; flex-direction: column; gap: 10px; }
        .playlist-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); }
        .playlist-item.active { border-color: #87CEEB; background: rgba(135, 206, 235, 0.15); }
        .playlist-item img { width: 70px; height: 50px; object-fit: cover; border-radius: 5px; }
        .playlist-item span { color: #fff; font-size: 14px; font-weight: 600; }

        .spotify-block { height: 152px; flex-shrink: 0; }

        @media (max-width: 1024px) {
            .main-container { flex-direction: column; }
            .sidebar-section { flex: none; width: 100%; max-height: 250px; flex-direction: row; }
            .sidebar-section.hidden { display: none !important; }
            .playlist-section { flex: 1; }
            .playlist-items { flex-direction: row; overflow-x: auto; }
            .spotify-block { width: 300px; }
        }
        @media (max-width: 768px) {
            .sidebar-section { flex-direction: column; max-height: none; }
            .spotify-block { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="vintage-overlay"></div>

    <header>
        <div class="header-left">
            <button class="icon-btn" onclick="history.back();" title="Quay lại">❮</button>
            <div class="live-title" id="main-title">
                <div class="live-dot"></div> Biển Nha Trang
            </div>
        </div>
        <div class="header-right">
            <button class="btn-toggle-chat" onclick="toggleSidebar()">💬 Tiện Ích</button>
        </div>
    </header>

    <div class="main-container">
        
        <div class="video-wrapper-section">
            <div class="player-container" id="player-container">
                <div id="video-wrapper">
                    <video id="html5-video" autoplay loop muted playsinline>
                        <source src="NhaTrang1.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="seek-bar-container"><input type="range" class="seek-bar" id="seek-bar" min="0" max="100" value="0"></div>
                <div class="custom-controls">
                    <div class="control-group">
                        <button class="control-btn" id="btn-play" onclick="togglePlayPause()">⏸</button>
                        <button class="control-btn" id="btn-mute" onclick="toggleMute()">🔇</button>
                        <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="0" oninput="changeVolume()">
                        <span class="time-display" id="time-display">0:00</span>
                    </div>
                    <div class="control-group"><button class="control-btn" onclick="openFullscreen()">⛶</button></div>
                </div>
            </div>

            <div class="tabs-container" id="swipe-area">
                <div class="tabs-header">
                    <button class="tab-btn active" id="btn-tab-pomo" onclick="switchTab('pomo-tab')">⏱ Pomodoro</button>
                    <button class="tab-btn" id="btn-tab-chat" onclick="switchTab('chat-tab')">💬 Giao Lưu</button>
                </div>
                <div class="tabs-content">
                    
                    <div id="pomo-tab" class="tab-pane active">
                        <div class="pomo-wrapper">
                            <div class="pomo-header-btns">
                                <button class="pomo-btn active" id="btn-pomo" onclick="setPomoMode('pomo')">Pomodoro</button>
                                <button class="pomo-btn" id="btn-short" onclick="setPomoMode('short')">Short Break</button>
                                <button class="pomo-btn" id="btn-long" onclick="setPomoMode('long')">Long Break</button>
                            </div>
                            <div class="pomo-time" id="pomo-time">25:00</div>
                            <button class="pomo-start" id="pomo-start-btn" onclick="togglePomo()">BẮT ĐẦU</button>
                        </div>
                    </div>

                    <div id="chat-tab" class="tab-pane">
                        <div class="chat-messages" id="chat-messages">
                            <div class="message"><div class="avatar">Y</div><div class="msg-content"><div class="msg-author">Hải Yến</div>Mọi người học chung không? Bật Pomodoro lên đi! 📚</div></div>
                        </div>
                        <div class="chat-input-wrapper">
                            <button class="btn-emoji" onclick="document.getElementById('chat-input').value += '🌊'">😀</button>
                            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') { sendMessage(); this.blur(); }">
                            <button class="btn-send" onclick="sendMessage()">➤</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="sidebar-section hidden" id="sidebar-box">
            <div class="playlist-section widget-block">
                <h3>🌊 Khám phá địa danh</h3>
                <div class="playlist-items">
                    <div class="playlist-item active" onclick="changeVideo('NhaTrang1.mp4', this, 'Biển Nha Trang')">
                        <img src="https://images.unsplash.com/photo-1559586616-361e46fb9617?w=300" alt="Nha Trang"><span>Nha Trang</span>
                    </div>
                    <div class="playlist-item" onclick="changeVideo('HaLong1.mp4', this, 'Vịnh Hạ Long')">
                        <img src="https://images.unsplash.com/photo-1528127269322-539801943592?w=300" alt="Hạ Long"><span>Hạ Long</span>
                    </div>
                    <div class="playlist-item" onclick="changeVideo('PhanThiet1.mp4', this, 'Biển Phan Thiết')">
                        <img src="https://images.unsplash.com/photo-1544158498-8ec052eeb2c0?w=300" alt="Phan Thiết"><span>Phan Thiết</span>
                    </div>
                </div>
            </div>
            
            <div class="widget-block spotify-block">
                <iframe style="border-radius:0px;" src="https://open.spotify.com/embed/playlist/0vvXsWCC9xrXsKd4FyS8kM?utm_source=generator&theme=0" width="100%" height="100%" frameBorder="0" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('mousemove', function(e) {
            if (Math.random() < 0.15) {
                const sparkle = document.createElement('div');
                sparkle.style.position = 'absolute'; sparkle.style.pointerEvents = 'none'; sparkle.style.zIndex = '9999';
                sparkle.style.background = '#87CEEB'; sparkle.style.borderRadius = '50%';
                sparkle.style.boxShadow = '0 0 8px #00d2ff, 0 0 15px #ffffff';
                sparkle.style.left = e.pageX + 'px'; sparkle.style.top = e.pageY + 'px';
                const size = Math.random() * 6 + 4;
                sparkle.style.width = size + 'px'; sparkle.style.height = size + 'px';
                sparkle.style.transition = 'all 0.8s ease-out';
                document.body.appendChild(sparkle);
                requestAnimationFrame(() => { sparkle.style.opacity = '0'; sparkle.style.transform = 'translateY(20px) scale(0)'; });
                setTimeout(() => sparkle.remove(), 800);
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'pomo-tab') document.getElementById('btn-tab-pomo').classList.add('active');
            if(tabId === 'chat-tab') document.getElementById('btn-tab-chat').classList.add('active');
        }

        let touchstartX = 0; let touchendX = 0;
        const swipeArea = document.getElementById('swipe-area');
        swipeArea.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
        swipeArea.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - 50) switchTab('chat-tab');
            if (touchendX > touchstartX + 50) switchTab('pomo-tab');
        }, {passive: true});

        function toggleSidebar() { document.getElementById('sidebar-box').classList.toggle('hidden'); }

        let pomoTime = 25 * 60; let pomoInterval = null; let isPomoRunning = false;
        function updatePomoDisplay() { let m = Math.floor(pomoTime / 60); let s = pomoTime % 60; document.getElementById('pomo-time').innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`; }
        function setPomoMode(mode) {
            clearInterval(pomoInterval); isPomoRunning = false; document.getElementById('pomo-start-btn').innerText = 'BẮT ĐẦU';
            document.querySelectorAll('.pomo-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'pomo') { pomoTime = 25 * 60; document.getElementById('btn-pomo').classList.add('active'); }
            else if (mode === 'short') { pomoTime = 5 * 60; document.getElementById('btn-short').classList.add('active'); }
            else if (mode === 'long') { pomoTime = 15 * 60; document.getElementById('btn-long').classList.add('active'); }
            updatePomoDisplay();
        }
        function togglePomo() {
            if (isPomoRunning) { clearInterval(pomoInterval); document.getElementById('pomo-start-btn').innerText = 'TIẾP TỤC'; }
            else { pomoInterval = setInterval(() => { if (pomoTime > 0) { pomoTime--; updatePomoDisplay(); } else { clearInterval(pomoInterval); alert("Hết giờ rồi!"); document.getElementById('pomo-start-btn').innerText = 'BẮT ĐẦU'; isPomoRunning = false; } }, 1000); document.getElementById('pomo-start-btn').innerText = 'TẠM DỪNG'; }
            isPomoRunning = !isPomoRunning;
        }

        function sendMessage() {
            const inputField = document.getElementById('chat-input'); const messageText = inputField.value.trim();
            if (messageText !== "") {
                const chatMessages = document.getElementById('chat-messages'); const newMessage = document.createElement('div'); newMessage.classList.add('message', 'self');
                newMessage.innerHTML = `<div class="avatar">T</div><div class="msg-content"><div class="msg-author">Bạn</div>${messageText}</div>`;
                chatMessages.appendChild(newMessage); chatMessages.scrollTop = chatMessages.scrollHeight; inputField.value = "";
            }
        }

        const videoPlayer = document.getElementById('html5-video'); const playBtn = document.getElementById('btn-play'); const muteBtn = document.getElementById('btn-mute'); const volumeSlider = document.getElementById('volume-slider'); const seekBar = document.getElementById('seek-bar'); const timeDisplay = document.getElementById('time-display'); let isDragging = false;
        function togglePlayPause() { videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause(); }
        videoPlayer.addEventListener('play', () => playBtn.innerText = '⏸'); videoPlayer.addEventListener('pause', () => playBtn.innerText = '▶️');
        function formatTime(s) { if (isNaN(s) || s < 0) return "0:00"; let m = Math.floor(s / 60); let sec = Math.floor(s % 60); return m + ":" + (sec < 10 ? "0" + sec : sec); }
        videoPlayer.addEventListener('timeupdate', () => { if (!isDragging && videoPlayer.duration) { seekBar.value = (videoPlayer.currentTime / videoPlayer.duration) * 100; timeDisplay.innerText = formatTime(videoPlayer.currentTime) + ' / ' + formatTime(videoPlayer.duration); } });
        seekBar.addEventListener('mousedown', () => isDragging = true); seekBar.addEventListener('touchstart', () => isDragging = true);
        function updateVideoTime() { isDragging = false; if (videoPlayer.duration) videoPlayer.currentTime = videoPlayer.duration * (seekBar.value / 100); }
        seekBar.addEventListener('mouseup', updateVideoTime); seekBar.addEventListener('touchend', updateVideoTime);
        function changeVolume() { videoPlayer.volume = volumeSlider.value / 100; if (videoPlayer.volume > 0 && videoPlayer.muted) { videoPlayer.muted = false; muteBtn.innerText = '🔊'; } else if (videoPlayer.volume == 0) { videoPlayer.muted = true; muteBtn.innerText = '🔇'; } }
        function toggleMute() { videoPlayer.muted = !videoPlayer.muted; if (videoPlayer.muted) { muteBtn.innerText = '🔇'; volumeSlider.value = 0; } else { muteBtn.innerText = '🔊'; videoPlayer.volume = 0.5; volumeSlider.value = 50; } }
        function changeVideo(src, element, titleName) {
            videoPlayer.src = src; videoPlayer.play();
            document.querySelectorAll('.playlist-item').forEach(i => i.classList.remove('active')); element.classList.add('active');
            document.getElementById('main-title').innerHTML = '<div class="live-dot"></div> ' + titleName;
        }
        function openFullscreen() { const p = document.getElementById("player-container"); p.requestFullscreen ? p.requestFullscreen() : (p.webkitRequestFullscreen && p.webkitRequestFullscreen()); }
    </script>
</body>
</html>
